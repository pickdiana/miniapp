<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f13">
    <title>Catálogo | Mini App</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #18181f;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent: #3b82f6;
            --border: #27272a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); padding: 16px; min-height: 100vh; }
        .site-header { margin-bottom: 20px; text-align: center; }
        .brand-name { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.05em; color: var(--text-primary); text-transform: uppercase; }
        .catalog-toolbar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 20px; scrollbar-width: none; }
        .catalog-toolbar::-webkit-scrollbar { display: none; }
        .category-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-secondary); padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .category-btn.active, .category-btn:hover { background: var(--text-primary); color: var(--bg-color); border-color: var(--text-primary); }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
        .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s; }
        .product-card img { width: 100%; height: 160px; object-fit: cover; background: #202028; }
        .product-info { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
        .product-title { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); line-height: 1.2; }
        .product-price { font-size: 0.95rem; font-weight: 700; color: var(--accent); margin-top: auto; }
        .product-status { font-size: 0.75rem; color: #10b981; }
        #product-count { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 12px; display: block; }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1 class="brand-name" id="brand-title">CATÁLOGO</h1>
        </div>
    </header>

    <main id="main">
        <div class="catalog-container">
            <div class="catalog-controls" id="collection">
                <nav class="category-nav" id="category-nav">
                    <!-- Las categorías se cargan dinámicamente desde app.js -->
                </nav>
            </div>
            <span id="product-count" role="status">0 piezas</span>
            <div class="product-grid" id="product-grid">
                <!-- Los productos se cargan dinámicamente desde app.js -->
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
